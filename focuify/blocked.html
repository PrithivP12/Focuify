<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paused by Focuify</title>
    <link rel="icon" href="icon.png" />
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <main class="panel">
      <div class="brand-row">
        <img class="brand-logo" src="focuify-logo.png" alt="Focuify" />
      </div>

      <div class="pause-mark" aria-hidden="true"><span>!</span></div>
      <p class="eyebrow">Focus check</p>
      <h1>This page is outside your goal.</h1>
      <p class="summary" id="summaryText"></p>

      <dl class="metrics">
        <div>
          <dt>Current goal</dt>
          <dd id="goalText"></dd>
        </div>
        <div>
          <dt>Page</dt>
          <dd id="domainText"></dd>
        </div>
        <div>
          <dt>Match score</dt>
          <dd>
            <span id="scoreText"></span>
            <small>/ required <span id="thresholdText"></span></small>
          </dd>
        </div>
      </dl>

      <div class="actions">
        <button id="goBackButton" class="primary">
          Go back to focused work
        </button>
        <div class="override-actions">
          <button id="relevantButton">This page helps my goal</button>
          <button id="openOnceButton">Open once</button>
          <button id="allowDomainButton">Always allow this site</button>
        </div>
      </div>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
